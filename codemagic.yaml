workflows:
  ios-testflight:
    name: DZMarket iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: dzmarket_appstore
    environment:
      groups:
        - dzmarket_secrets
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dzmarket.app
      vars:
        APP_FLAVOR: prod
        APP_BUILD_NAME: "1.0.2"
        APP_BUILD_NUMBER: "19"
        ENABLE_ANALYTICS: "true"
        ENABLE_CRASHLYTICS: "true"
    scripts:
      - name: Flutter pub get
        script: |
          flutter pub get
      - name: Validate production environment
        script: |
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL is missing"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "SUPABASE_ANON_KEY is missing"; exit 1; }
          echo "SUPABASE_URL present"
          echo "SUPABASE_ANON_KEY present"
      - name: Set up iOS code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.dzmarket.app" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --export-options-plist="$HOME/export_options.plist" \
            --build-name=$APP_BUILD_NAME \
            --build-number=$APP_BUILD_NUMBER \
            --dart-define=APP_FLAVOR=$APP_FLAVOR \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=ENABLE_ANALYTICS=$ENABLE_ANALYTICS \
            --dart-define=ENABLE_CRASHLYTICS=$ENABLE_CRASHLYTICS
      - name: Verify IPA exists
        script: |
          echo "Looking for generated IPA files..."
          find build -type f -name "*.ipa" -print || true
          IPA_PATH="$(find build -type f -name "*.ipa" | head -n 1)"
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA generated by flutter build ipa."
            exit 1
          fi
          echo "Using IPA: $IPA_PATH"
    artifacts:
      - build/**/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
